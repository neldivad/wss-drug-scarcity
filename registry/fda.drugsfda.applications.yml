# PAUSED — needs a frozen cohort before it can go active. See Q14.
#
# WHAT IT ANSWERS. Drugs@FDA gives each product's CURRENT marketing_status
# (Prescription / Over-the-counter / Discontinued) but NO discontinuation
# date — not in the API, and not in FDA's own bulk MarketingStatus.txt, which
# is `MarketingStatusID | ApplNo | ProductNo` and nothing else. So the LEVEL
# of supplier attrition is answerable today (see reference/) and the TIMING is
# destroyed in place. Watching the count per molecule turns each exit into a
# dated event, which is the whole of Q14.
#
# WHY count= AND NOT THE FULL DATABASE. Capturing all 29,298 applications
# costs ~117 MB raw / ~9.5 MB compressed per capture — ~114 MB/yr monthly,
# against the repo's 31 MB/yr. A `count=products.marketing_status` query
# returns exactly the numbers this question needs:
#
#     {"Discontinued": 33, "Prescription": 4}
#
# in about 400 bytes. A 150-molecule cohort is ~0.7 MB/yr — roughly 150x
# cheaper than the full capture, for strictly more signal per byte.
#
# WHAT IS STILL MISSING: the cohort. Molecules must be chosen ONCE, on stated
# criteria, and followed forever including the ones that die — `wss.cohort`,
# selected by hand and committed, never re-picked on a cron. Selecting "the
# drugs short today" every quarter would delete every shortage that resolved,
# which is the exact survivorship failure this repo exists to avoid. One
# endpoint per cohort molecule goes below; the single entry here is the
# worked example, and it stays paused until the cohort exists.
source_id: fda.drugsfda.applications
status: paused
cadence: monthly
schema_id: fda-drugsfda-count.v1

publisher: US Food and Drug Administration
publisher_tier: first_party
destroys_own_history: true
licence: "US federal work, no copyright in the US; https://open.fda.gov/terms/"
personal_data: none
storage: git

notes: >-
  Ingredient names are the join key and they are messy — 13 of 70 shortage
  drugs did not resolve to an application on a plain name match. The cohort
  file should carry a checked ingredient string per molecule rather than
  deriving one from the shortage feed's generic_name at capture time.

endpoints:
  - url: "https://api.fda.gov/drug/drugsfda.json?search=products.active_ingredients.name:%22DOPAMINE+HYDROCHLORIDE%22&count=products.marketing_status"
    delay_seconds: 5

gates:
  expect_status: 200
  min_bytes: 150
  content_type_any: [json]
  must_contain: ["results", "term"]
  must_not_contain: ["NOT_FOUND"]
