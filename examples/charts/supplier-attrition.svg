<text x="24.0" y="54.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">Every product ever approved to make each drug, against those still marketed. Decision this supports: which shortages</text>
<text x="24.0" y="71.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">are a manufacturing problem and which are an exit problem — a drug whose makers all left will not be fixed by asking</text>
