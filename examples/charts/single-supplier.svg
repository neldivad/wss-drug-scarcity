<svg xmlns="http://www.w3.org/2000/svg" width="980.0" height="360.0" viewBox="0 0 980.0 360.0" role="img" aria-label="Drugs down to one listed package">
<title>Drugs down to one listed package</title>
<desc>Table naming the drugs in shortage that have only one package NDC listed, with therapeutic class.</desc>
<rect width="980.0" height="360.0" fill="#fcfcfb"/>
<text x="24.0" y="32.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">Q7 — drugs in shortage with a single package still listed</text>
<text x="24.0" y="54.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">6 of 70 drugs currently in shortage have exactly one package NDC on FDA's list.</text>
<text x="24.0" y="74.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">Decision this supports: these are the drugs where one more delisting means none — the substitution plans worth writing</text>
<text x="24.0" y="91.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">before they are needed, not after.</text>
<text x="24.0" y="118.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10" fill="#898781" text-anchor="start" font-weight="600" style="">drug</text>
<text x="430.0" y="118.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10" fill="#898781" text-anchor="start" font-weight="600" style="">therapeutic class</text>
<text x="956.0" y="118.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10" fill="#898781" text-anchor="end" font-weight="600" style="">years short</text>
<line x1="24" y1="126" x2="956.0" y2="126" stroke="#c3c2b7" stroke-width="1"/>
<rect x="24" y="134.0" width="932.0" height="24.0" fill="#f4f3ee"/>
<text x="30.0" y="150.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal" style="">bacitracin ophthalmic ointment</text>
<text x="430.0" y="150.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">anti infective, ophthalmology</text>
<text x="950.0" y="150.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="600" style="font-variant-numeric: tabular-nums;">1</text>
<text x="30.0" y="176.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal" style="">conivaptan hydrochloride injection</text>
<text x="430.0" y="176.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">cardiovascular</text>
<text x="950.0" y="176.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="600" style="font-variant-numeric: tabular-nums;">4</text>
<rect x="24" y="186.0" width="932.0" height="24.0" fill="#f4f3ee"/>
<text x="30.0" y="202.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal" style="">echothiophate iodide ophthalmic solution</text>
<text x="430.0" y="202.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">ophthalmology</text>
<text x="950.0" y="202.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="600" style="font-variant-numeric: tabular-nums;">7</text>
<text x="30.0" y="228.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal" style="">isocarboxazid tablet</text>
<text x="430.0" y="228.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">psychiatry</text>
<text x="950.0" y="228.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="600" style="font-variant-numeric: tabular-nums;">0</text>
<rect x="24" y="238.0" width="932.0" height="24.0" fill="#f4f3ee"/>
<text x="30.0" y="254.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal" style="">pentostatin injection</text>
<text x="430.0" y="254.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">oncology</text>
<text x="950.0" y="254.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="600" style="font-variant-numeric: tabular-nums;">0</text>
<text x="30.0" y="280.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="normal" style="">triamcinolone hexacetonide injection</text>
<text x="430.0" y="280.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">rheumatology</text>
<text x="950.0" y="280.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#0b0b0b" text-anchor="end" font-weight="600" style="font-variant-numeric: tabular-nums;">5</text>
<text x="24.0" y="346.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10" fill="#898781" text-anchor="start" font-weight="normal" style="">A single listed package is not proof of a single manufacturer — packages not on the shortage list are invisible here. It is a shortlist to check, not a verdict.</text>
</svg>
