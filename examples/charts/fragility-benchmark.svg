<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Injectable fragility against market share">
<title>Injectable fragility against market share</title>
<desc>Two bars comparing the injectable share of all marketed drugs with the injectable share of drugs in shortage.</desc>
<rect width="900" height="300" fill="#fcfcfb"/>
<text x="24.0" y="30.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">Q8 — injectables are 9x over-represented in shortages</text>
<text x="24.0" y="50.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">share of products that are injectable, market against shortage list</text>
<path d="M230.0,104.0 h39.6 q4,0 4,4 v22.0 q0,4 -4,4 h-39.6 z" fill="#9ec5f4"/>
<text x="220.0" y="124.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="end" font-weight="normal" style="">all marketed drug products</text>
<text x="281.6" y="124.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums;">7.6%</text>
<path d="M230.0,168.0 h402.7 q4,0 4,4 v22.0 q0,4 -4,4 h-402.7 z" fill="#c2410c"/>
<text x="220.0" y="188.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="end" font-weight="normal" style="">drugs currently in shortage</text>
<text x="644.7" y="188.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600" style="font-variant-numeric: tabular-nums;">70.8%</text>
<line x1="230" y1="94" x2="230" y2="242" stroke="#c3c2b7" stroke-width="1"/>
<text x="24.0" y="254.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">enrichment: 9.3x</text>
<text x="24.0" y="274.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10" fill="#898781" text-anchor="start" font-weight="normal" style="">Market denominator: openFDA /drug/ndc.json by dosage_form, 9,883 injectable of 130,081 products (2026-09-02).</text>
<text x="24.0" y="290.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10" fill="#898781" text-anchor="start" font-weight="normal" style="">Shortage share is computed from this repo's published table; the denominator is not, and is stated above.</text>
</svg>
