<text x="24.0" y="204.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10" fill="#898781" text-anchor="start" font-weight="normal" style="">Counts a field rather than resolving a company, so acquisitions and renames cannot distort it (Q4). A drug at one package is not proof of one supplier — unlisted packages are not visible here.</text>
