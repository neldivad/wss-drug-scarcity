<svg xmlns="http://www.w3.org/2000/svg" width="980.0" height="486.0" viewBox="0 0 980.0 486.0" role="img" aria-label="GMP import bans by year and origin">
<title>GMP import bans by year and origin</title>
<desc>Stacked columns of firms added to FDA Import Alert 66-40 each year, split China, India, rest of world.</desc>
<rect width="980.0" height="486.0" fill="#fcfcfb"/>
<text x="24.0" y="32.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600" style="">Q6 — when firms were barred from shipping drugs to the US</text>
<text x="24.0" y="54.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">All 448 manufacturing sites on Import Alert 66-40 (GMP failure), by the year FDA first listed them. Decision this</text>
<text x="24.0" y="71.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">supports: whether the qualified-supplier base is shrinking, and where. Bars are additions, not the standing total —</text>
<text x="24.0" y="88.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">nothing here shows firms that got off the list, because FDA keeps no record of that.</text>
