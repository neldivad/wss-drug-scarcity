<text x="490.0" y="118.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="13" fill="#52514e" text-anchor="middle" font-weight="normal" style="">1 capture(s) so far. No shortage has begun and ended inside this record yet.</text>
<text x="490.0" y="144.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#898781" text-anchor="middle" font-weight="normal" style="">FDA retains 7 resolved records out of 1,623, so no archive anywhere can backfill this.</text>
<text x="490.0" y="168.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#898781" text-anchor="middle" font-weight="normal" style="">The series starts the week capture started, and this figure fills itself in.</text>
<text x="24.0" y="236.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10" fill="#898781" text-anchor="start" font-weight="normal" style="">A longitudinal repo should say so on day one rather than ship an empty axis.</text>
