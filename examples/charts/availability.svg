<text x="24.0" y="542.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">7 drugs in shortage have no available package at all, and 298 of 1156 listed packages are unavailable. Injectables are</text>
<text x="24.0" y="559.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">28% unavailable against 19% for other forms, so they are not merely over-represented in shortage but worse affected</text>
<text x="24.0" y="576.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">once short. And oncology is the worst class by rate (42% of its packages unavailable) while anesthesia has the most</text>
<text x="24.0" y="593.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="12" fill="#52514e" text-anchor="start" font-weight="normal" style="">packages — severity and volume rank differently.</text>
<text x="24.0" y="616.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10" fill="#898781" text-anchor="start" font-weight="normal" style="">Availability is self-reported by the manufacturer and refers to that package, not to what a given hospital can actually obtain. Drugs with fewer than</text>
<text x="24.0" y="630.0" font-family='system-ui, -apple-system, "Segoe UI", sans-serif' font-size="10" fill="#898781" text-anchor="start" font-weight="normal" style="">three listed packages are omitted here so a single package does not read as 100%.</text>
</svg>
