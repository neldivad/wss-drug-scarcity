<svg xmlns="http://www.w3.org/2000/svg" width="980.0" height="602.0" viewBox="0 0 980.0 602.0" role="img" aria-label="Availability of drugs in shortage">
<title>Availability of drugs in shortage</title>
<desc>Stacked bars of unavailable, limited and available packages for each drug currently in shortage.</desc>
